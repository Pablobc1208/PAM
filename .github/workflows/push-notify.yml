name: Push notification

# Runs on every push to any branch. When the pusher is not Pablo,
# it leaves a comment on the pushed commit that mentions @Pablobc1208,
# so GitHub sends him a notification (web + email).
on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  notify:
    if: github.actor != 'Pablobc1208' && github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Mention Pablo on the pushed commit
        uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload;
            const branch = context.ref.replace('refs/heads/', '');
            const repoUrl = p.repository.html_url;
            const commits = (p.commits || [])
              .map(c => `- \`${c.id.substring(0, 7)}\` ${c.message.split('\n')[0]}`)
              .join('\n') || '- (no new commits)';
            const target = branch === 'main' ? null : (branch === 'dev' ? 'main' : 'dev');
            const prLink = target
              ? `[Open a pull request ${branch} → ${target}](${repoUrl}/compare/${target}...${encodeURIComponent(branch)}?expand=1)`
              : '';
            const body = [
              `@Pablobc1208 **${context.actor}** pushed to \`${branch}\`.`,
              '',
              commits,
              '',
              `[See the changes](${p.compare})`,
              prLink,
              '',
              'This code only reaches `dev`/`main` through a pull request that Pablo approves.'
            ].join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: p.after,
              body
            });
